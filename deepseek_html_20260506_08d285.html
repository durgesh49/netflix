<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Our Memories · Shared Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #e5e5e5; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #e50914; border-radius: 8px; }

        .login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #0a0a0a, #000);
            backdrop-filter: blur(8px);
            z-index: 2000; display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: #111; padding: 2rem; border-radius: 48px; width: 90%; max-width: 380px;
            text-align: center; border: 1px solid rgba(229,9,20,0.4);
        }
        .login-logo { font-size: 3rem; font-weight: 900; background: linear-gradient(135deg, #e50914, #b20710); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .pin-dots { display: flex; justify-content: center; gap: 15px; margin: 1.5rem 0; }
        .pin-dot { width: 14px; height: 14px; background: #444; border-radius: 50%; }
        .pin-dot.filled { background: #e50914; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 1.5rem 0; }
        .key-btn { background: #1f1f1f; border: none; padding: 14px; border-radius: 60px; font-size: 1.8rem; color: white; cursor: pointer; }
        .key-btn:active { background: #e50914; }
        .key-btn.delete-btn { background: #3a1a1a; color: #e50914; }
        .error-msg { color: #e50914; }
        .app { display: none; }
        
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 4%; background: linear-gradient(to bottom, #050505, transparent); position: sticky; top: 0; }
        .navbar-logo { font-size: 1.6rem; font-weight: 900; background: linear-gradient(135deg, #fff, #e50914); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .nav-icons i { font-size: 1.4rem; margin-left: 1.2rem; cursor: pointer; color: #ddd; }
        .nav-icons i:hover { color: #e50914; }
        
        .search-box { background: #181818; border-radius: 40px; padding: 0.5rem 1rem; margin: 1rem 4%; display: flex; align-items: center; border: 1px solid #2c2c2c; }
        .search-box input { background: transparent; border: none; color: white; width: 100%; outline: none; }
        
        .hero { margin: 1rem 4%; border-radius: 20px; overflow: hidden; height: 45vh; position: relative; background: linear-gradient(135deg, #1a1a2e, #0f0f0f); }
        .hero-bg { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .hero-content { position: absolute; bottom: 15%; left: 5%; }
        .hero-btn { background: #e50914; border: none; padding: 0.5rem 1.5rem; border-radius: 40px; margin-top: 0.5rem; cursor: pointer; }
        
        .row { margin: 1.5rem 4%; }
        .horizontal-row { display: flex; overflow-x: auto; gap: 1rem; padding-bottom: 1rem; }
        .memory-card { flex: 0 0 150px; cursor: pointer; border-radius: 14px; overflow: hidden; background: #111; transition: 0.2s; }
        .memory-card:hover { transform: scale(1.05); }
        .card-img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .card-info { padding: 0.5rem; }
        .card-info h4 { font-size: 0.8rem; white-space: nowrap; overflow: hidden; }
        
        .upload-panel { background: #0f0f0f; margin: 1rem 4%; padding: 1.2rem; border-radius: 24px; display: none; border: 1px solid #2a2a2a; }
        .drop-zone { border: 2px dashed #e50914; border-radius: 20px; padding: 1.5rem; text-align: center; cursor: pointer; background: #1a1a1a; margin-bottom: 1rem; }
        .preview-grid { display: flex; flex-wrap: wrap; gap: 0.8rem; max-height: 250px; overflow-y: auto; margin: 1rem 0; }
        .preview-item { position: relative; width: 80px; }
        .preview-item img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; }
        .preview-item button { position: absolute; top: -6px; right: -6px; background: #e50914; border: none; border-radius: 50%; width: 22px; height: 22px; color: white; cursor: pointer; }
        .upload-inputs { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .upload-inputs input { flex: 1; padding: 10px; background: #2a2a2a; border: none; border-radius: 30px; color: white; }
        .upload-btn { background: #e50914; border: none; padding: 12px; border-radius: 40px; font-weight: bold; cursor: pointer; width: 100%; }
        
        .modal-detail { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1500; display: none; overflow-y: auto; }
        .detail-container { max-width: 500px; margin: 2rem auto; background: #111; border-radius: 28px; }
        .detail-media img, .detail-media video { width: 100%; max-height: 55vh; object-fit: contain; }
        .detail-info { padding: 1.5rem; }
        .close-detail { float: right; font-size: 1.8rem; background: none; border: none; color: white; cursor: pointer; padding: 0.8rem; }
        
        .bg-music-icon { position: fixed; bottom: 20px; right: 20px; background: #1f1f1f; border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid #e50914; z-index: 1000; }
        .loading { text-align: center; padding: 1rem; color: #e50914; }
        #savedPanel { background: #0a0a0a; padding: 1rem 4%; border-top: 1px solid #2c2c2c; display: none; }
        #savedListGrid { display: flex; gap: 1rem; overflow-x: auto; }
        
        @media (max-width: 600px) { .memory-card { flex: 0 0 130px; } }
    </style>
</head>
<body>

<div id="loginOverlay" class="login-overlay">
    <div class="login-card">
        <div class="login-logo">N</div>
        <div class="pin-dots" id="pinDots">
            <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
        </div>
        <div class="keypad" id="keypad">
            <button class="key-btn" data-num="1">1</button><button class="key-btn" data-num="2">2</button><button class="key-btn" data-num="3">3</button>
            <button class="key-btn" data-num="4">4</button><button class="key-btn" data-num="5">5</button><button class="key-btn" data-num="6">6</button>
            <button class="key-btn" data-num="7">7</button><button class="key-btn" data-num="8">8</button><button class="key-btn" data-num="9">9</button>
            <button class="key-btn delete-btn" id="deletePin">⌫</button>
            <button class="key-btn" data-num="0">0</button>
            <button class="key-btn" id="clearPin">C</button>
        </div>
        <div id="loginError" class="error-msg"></div>
    </div>
</div>

<div class="app" id="app">
    <audio id="bgAudio" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
    <div class="bg-music-icon" id="musicToggleIcon"><i class="fas fa-music"></i></div>

    <nav class="navbar">
        <div class="navbar-logo">N</div>
        <div class="nav-icons">
            <i class="fas fa-heart" id="savedNavIcon"></i>
            <i class="fas fa-upload" id="uploadNavIcon"></i>
        </div>
    </nav>

    <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search memories...">
    </div>

    <div class="hero">
        <img class="hero-bg" id="heroImg" src="https://picsum.photos/id/104/800/400">
        <div class="hero-content">
            <h1 id="heroTitle">Our Memories</h1>
            <p id="heroDesc">❤️ Shared with love</p>
            <button class="hero-btn" id="heroPlayBtn">▶ Explore</button>
        </div>
    </div>

    <div id="loadingIndicator" class="loading" style="display:none;">☁️ Uploading to cloud...</div>
    <div id="rowsContainer"></div>

    <div id="savedPanel">
        <h2>⭐ My List</h2>
        <div id="savedListGrid"></div>
    </div>

    <div id="uploadPanel" class="upload-panel">
        <h3>📸 Upload to Cloud (GF will see instantly)</h3>
        <div class="drop-zone" id="dropZone">
            <i class="fas fa-cloud-upload-alt" style="font-size: 2.5rem; color: #e50914;"></i>
            <p>📱 Click or Drag & Drop photos/videos</p>
            <input type="file" id="fileInput" multiple accept="image/*,video/*" style="display:none">
        </div>
        <div id="previewGrid" class="preview-grid"></div>
        <div class="upload-inputs">
            <input type="text" id="uploadCaption" placeholder="📝 Title / Caption">
            <input type="text" id="uploadDate" placeholder="📅 Date">
        </div>
        <button id="uploadToCloudBtn" class="upload-btn">☁️ Upload to Cloud</button>
    </div>

    <div id="detailModal" class="modal-detail">
        <div class="detail-container">
            <button class="close-detail" id="closeDetailBtn">&times;</button>
            <div class="detail-media" id="detailMedia"></div>
            <div class="detail-info">
                <h2 id="detailTitle"></h2>
                <p id="detailDate" style="color:#e50914;"></p>
                <p id="detailDesc"></p>
                <button id="saveDetailBtn" style="background:#e50914; border:none; padding:10px 24px; border-radius:30px; margin-top:12px; cursor:pointer;">❤️ Save to My List</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // ✅✅✅ TERA CLOUDINARY SETUP - DONE ✅✅✅
    // ============================================================
    const CLOUD_NAME = "dkfvnvbol";
    const UPLOAD_PRESET = "mypreset";
    // ============================================================
    
    let memories = JSON.parse(localStorage.getItem('all_memories')) || [];
    let savedIds = new Set(JSON.parse(localStorage.getItem('saved_ids')) || []);
    let currentSearch = "";
    let pendingFiles = [];
    
    function saveAll() {
        localStorage.setItem('all_memories', JSON.stringify(memories));
        localStorage.setItem('saved_ids', JSON.stringify([...savedIds]));
    }
    
    async function uploadToCloudinary(file) {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', UPLOAD_PRESET);
        
        const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`, {
            method: 'POST',
            body: formData
        });
        const data = await response.json();
        return data.secure_url;
    }
    
    async function uploadFile(file, caption, date) {
        document.getElementById("loadingIndicator").style.display = "block";
        try {
            const url = await uploadToCloudinary(file);
            const newMem = {
                id: Date.now() + "-" + Math.random(),
                title: caption || file.name.split('.')[0],
                description: "❤️ Added with love",
                date: date || new Date().toLocaleDateString(),
                type: file.type.startsWith("image/") ? "photo" : "video",
                mediaUrl: url,
                thumbUrl: url
            };
            memories.unshift(newMem);
            saveAll();
            renderRows();
            document.getElementById("loadingIndicator").style.display = "none";
            return true;
        } catch(e) {
            document.getElementById("loadingIndicator").style.display = "none";
            alert("Upload failed! Check Cloudinary preset.");
            return false;
        }
    }
    
    function filterMemories() {
        let filtered = memories.slice();
        if (currentSearch.trim()) {
            const s = currentSearch.toLowerCase();
            filtered = filtered.filter(m => m.title.toLowerCase().includes(s));
        }
        return filtered;
    }
    
    function renderRows() {
        const container = document.getElementById("rowsContainer");
        container.innerHTML = "";
        const filtered = filterMemories();
        
        const rowDiv = document.createElement("div"); rowDiv.className = "row";
        rowDiv.innerHTML = `<div class="row-header"><h2>📺 Our Memories</h2><span>${filtered.length} items</span></div><div class="horizontal-row"></div>`;
        container.appendChild(rowDiv);
        const rowContainer = rowDiv.querySelector(".horizontal-row");
        
        if (filtered.length === 0) {
            rowContainer.innerHTML = "<div style='text-align:center; padding:2rem; color:#888'>✨ No memories yet. Upload something! ✨</div>";
        } else {
            filtered.forEach(mem => rowContainer.appendChild(createCard(mem)));
        }
        
        updateHeroRandom();
        renderSavedList();
    }
    
    function createCard(mem) {
        const div = document.createElement("div"); div.className = "memory-card";
        div.innerHTML = `<img class="card-img" src="${mem.thumbUrl}"><div class="card-info"><h4>${mem.title.substring(0,25)}</h4><p>📅 ${mem.date}</p></div>`;
        div.onclick = () => openDetail(mem);
        return div;
    }
    
    function openDetail(mem) {
        const modal = document.getElementById("detailModal");
        document.getElementById("detailMedia").innerHTML = mem.type === "video" ? `<video controls autoplay src="${mem.mediaUrl}"></video>` : `<img src="${mem.mediaUrl}">`;
        document.getElementById("detailTitle").innerText = mem.title;
        document.getElementById("detailDate").innerText = mem.date;
        document.getElementById("detailDesc").innerText = mem.description;
        document.getElementById("saveDetailBtn").onclick = () => { savedIds.add(mem.id); saveAll(); renderRows(); alert("❤️ Saved to My List!"); };
        modal.style.display = "block";
    }
    
    function renderSavedList() {
        const container = document.getElementById("savedListGrid");
        const saved = memories.filter(m => savedIds.has(m.id));
        container.innerHTML = saved.length ? "" : "<div style='color:#aaa;'>No saved items</div>";
        saved.forEach(mem => {
            const div = document.createElement("div"); div.style.minWidth = "100px"; div.style.cursor = "pointer";
            div.innerHTML = `<img src="${mem.thumbUrl}" style="width:100%; border-radius:12px;"><p style="font-size:11px;">${mem.title}</p>`;
            div.onclick = () => openDetail(mem);
            container.appendChild(div);
        });
    }
    
    function updateHeroRandom() {
        const all = filterMemories();
        if(all.length) {
            const f = all[Math.floor(Math.random()*all.length)];
            document.getElementById("heroImg").src = f.thumbUrl;
            document.getElementById("heroTitle").innerText = f.title;
            document.getElementById("heroDesc").innerText = f.description;
            document.getElementById("heroPlayBtn").onclick = () => openDetail(f);
        }
    }
    
    // Upload handling
    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const previewGrid = document.getElementById("previewGrid");
    
    function handleFiles(files) {
        for(let file of files) {
            if(file.type.startsWith("image/") || file.type.startsWith("video/")) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    pendingFiles.push({ file: file, dataURL: e.target.result });
                    renderPreview();
                };
                reader.readAsDataURL(file);
            } else { alert("Only photos/videos allowed!"); }
        }
    }
    
    function renderPreview() {
        previewGrid.innerHTML = "";
        pendingFiles.forEach((item, idx) => {
            const div = document.createElement("div"); div.className = "preview-item";
            div.innerHTML = `<img src="${item.dataURL}"><button onclick="removeFile(${idx})">✕</button>`;
            previewGrid.appendChild(div);
        });
    }
    
    window.removeFile = (idx) => { pendingFiles.splice(idx,1); renderPreview(); };
    
    dropZone.onclick = () => fileInput.click();
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.style.borderColor = "#ff4444"; };
    dropZone.ondragleave = () => dropZone.style.borderColor = "#e50914";
    dropZone.ondrop = (e) => {
        e.preventDefault();
        dropZone.style.borderColor = "#e50914";
        handleFiles(e.dataTransfer.files);
    };
    fileInput.onchange = (e) => handleFiles(e.target.files);
    
    document.getElementById("uploadToCloudBtn").onclick = async () => {
        if(pendingFiles.length === 0) return alert("Select photos/videos first!");
        if(CLOUD_NAME === "YOUR_CLOUD_NAME") {
            alert("Please setup Cloudinary first! Check console for instructions.");
            return;
        }
        const caption = document.getElementById("uploadCaption").value;
        const date = document.getElementById("uploadDate").value || new Date().toLocaleDateString();
        
        for(let item of pendingFiles) {
            await uploadFile(item.file, caption, date);
        }
        pendingFiles = [];
        renderPreview();
        document.getElementById("uploadCaption").value = "";
        document.getElementById("uploadDate").value = "";
        alert("✨ Uploaded to cloud! GF can see it now ✨");
        document.getElementById("uploadPanel").style.display = "none";
    };
    
    // Netflix intro + Login
    let enteredPin = "";
    const CORRECT_PIN = "1127";
    
    function updatePinDots() {
        document.querySelectorAll(".pin-dot").forEach((dot, i) => {
            if(i < enteredPin.length) dot.classList.add("filled");
            else dot.classList.remove("filled");
        });
    }
    
    function playIntro() {
        const overlay = document.createElement("div");
        overlay.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;";
        overlay.innerHTML = '<div style="font-size:7rem;font-weight:900;background:linear-gradient(135deg,#e50914,#b20710);-webkit-background-clip:text;background-clip:text;color:transparent;animation:netflixZoom 1.6s forwards;">N</div>';
        document.body.appendChild(overlay);
        
        const style = document.createElement("style");
        style.textContent = `@keyframes netflixZoom{0%{opacity:0;transform:scale(0.2);filter:blur(12px)}25%{opacity:1;transform:scale(1)}50%{transform:scale(1.3)}75%{transform:scale(1.6)}100%{opacity:0;transform:scale(2.2);filter:blur(6px);visibility:hidden}}`;
        document.head.appendChild(style);
        
        // Play sound effect
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const gain = audioCtx.createGain();
            gain.connect(audioCtx.destination);
            const osc = audioCtx.createOscillator();
            osc.type = "sine";
            osc.frequency.value = 120;
            osc.connect(gain);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.6);
            if (audioCtx.state === "suspended") audioCtx.resume();
        } catch(e) {}
        
        setTimeout(() => {
            overlay.style.opacity = "0";
            setTimeout(() => {
                overlay.remove();
                document.getElementById("loginOverlay").style.display = "none";
                document.getElementById("app").style.display = "block";
                renderRows();
            }, 500);
        }, 1600);
    }
    
    function checkLogin() {
        if(enteredPin === CORRECT_PIN) {
            document.getElementById("loginOverlay").style.opacity = "0";
            playIntro();
        } else if(enteredPin.length === 4) {
            document.getElementById("loginError").innerHTML = "❌ Wrong PIN! (1127)";
            enteredPin = "";
            updatePinDots();
            setTimeout(() => document.getElementById("loginError").innerHTML = "", 1500);
        }
    }
    
    function addDigit(d) { if(enteredPin.length < 4) { enteredPin += d; updatePinDots(); if(enteredPin.length === 4) checkLogin(); } }
    
    document.querySelectorAll(".key-btn[data-num]").forEach(btn => btn.onclick = () => addDigit(btn.getAttribute("data-num")));
    document.getElementById("deletePin").onclick = () => { if(enteredPin.length > 0) { enteredPin = enteredPin.slice(0,-1); updatePinDots(); } };
    document.getElementById("clearPin").onclick = () => { enteredPin = ""; updatePinDots(); document.getElementById("loginError").innerHTML = ""; };
    
    document.getElementById("searchInput").oninput = (e) => { currentSearch = e.target.value; renderRows(); };
    document.getElementById("closeDetailBtn").onclick = () => document.getElementById("detailModal").style.display = "none";
    document.getElementById("savedNavIcon").onclick = () => { const p = document.getElementById("savedPanel"); p.style.display = p.style.display === "none" ? "block" : "none"; renderSavedList(); };
    document.getElementById("uploadNavIcon").onclick = () => { document.getElementById("uploadPanel").style.display = "block"; };
    
    let musicOn = false, audio = document.getElementById("bgAudio");
    document.getElementById("musicToggleIcon").onclick = () => {
        if(musicOn) { audio.pause(); musicOn=false; }
        else { audio.play().catch(e=>{}); musicOn=true; }
    };
    
    window.onclick = (e) => { if(e.target === document.getElementById("detailModal")) document.getElementById("detailModal").style.display = "none"; };
    
    // Load existing memories on start
    renderRows();
</script>
</body>
</html>
