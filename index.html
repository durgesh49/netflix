<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Netflix Style · Private Memories</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #000; color: #e5e5e5; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #e50914; border-radius: 8px; }

        /* NETFLIX STYLE INTRO OVERLAY */
        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }
        .netflix-intro-logo {
            font-size: 8rem;
            font-weight: 900;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e50914, #b20710);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            opacity: 0;
            transform: scale(0.3);
            animation: netflixNZoom 1.6s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
            text-shadow: 0 0 30px rgba(229,9,20,0.5);
            letter-spacing: -2px;
        }
        @keyframes netflixNZoom {
            0% {
                opacity: 0;
                transform: scale(0.2);
                filter: blur(12px);
            }
            25% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
            50% {
                opacity: 1;
                transform: scale(1.3);
            }
            75% {
                opacity: 1;
                transform: scale(1.6);
            }
            100% {
                opacity: 0;
                transform: scale(2.2);
                filter: blur(6px);
                visibility: hidden;
            }
        }

        /* LOGIN OVERLAY */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0a0a0a, #000);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }
        .login-card {
            background: #111;
            padding: 2rem;
            border-radius: 48px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            border: 1px solid rgba(229,9,20,0.4);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .login-logo {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #e50914, #b20710);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 1.5rem;
            letter-spacing: -2px;
        }
        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 1.5rem 0 1rem 0;
        }
        .pin-dot {
            width: 14px;
            height: 14px;
            background: #444;
            border-radius: 50%;
            transition: all 0.1s;
        }
        .pin-dot.filled {
            background: #e50914;
            box-shadow: 0 0 8px #e50914;
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 1.5rem 0;
        }
        .key-btn {
            background: #1f1f1f;
            border: none;
            padding: 14px;
            border-radius: 60px;
            font-size: 1.8rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.1s;
        }
        .key-btn:active {
            transform: scale(0.95);
            background: #e50914;
        }
        .key-btn.delete-btn {
            background: #3a1a1a;
            color: #e50914;
        }
        .error-msg {
            color: #e50914;
            font-size: 0.8rem;
            margin-top: 0.8rem;
        }
        
        /* MAIN APP */
        .app {
            display: none;
            animation: fadeIn 0.8s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 4%;
            background: linear-gradient(to bottom, #050505, transparent);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
        }
        .navbar-logo {
            font-size: 1.6rem;
            font-weight: 900;
            background: linear-gradient(135deg, #e50914, #b20710);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -1px;
        }
        .nav-icons i {
            font-size: 1.4rem;
            margin-left: 1.2rem;
            cursor: pointer;
            color: #ddd;
            transition: 0.2s;
        }
        .nav-icons i:hover {
            color: #e50914;
        }
        
        .search-filter {
            padding: 1rem 4%;
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            border-bottom: 1px solid #1f1f1f;
        }
        .search-box {
            flex: 2;
            background: #181818;
            border-radius: 40px;
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            border: 1px solid #2c2c2c;
        }
        .search-box input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            outline: none;
            font-size: 0.9rem;
        }
        
        .hero {
            margin: 1rem 4%;
            border-radius: 20px;
            overflow: hidden;
            height: 50vh;
            background: linear-gradient(135deg, #1a1a2e, #0f0f0f);
            position: relative;
        }
        .hero-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.65;
        }
        .hero-content {
            position: absolute;
            bottom: 15%;
            left: 5%;
        }
        .hero-content h1 {
            font-size: 2rem;
        }
        .hero-btn {
            background: #e50914;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 40px;
            font-weight: 600;
            margin-top: 0.5rem;
            cursor: pointer;
        }
        
        .row {
            margin: 1.5rem 4%;
        }
        .row-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.8rem;
        }
        .row-header h2 {
            font-size: 1.3rem;
        }
        .horizontal-row {
            display: flex;
            overflow-x: auto;
            gap: 1rem;
            padding-bottom: 1rem;
        }
        .memory-card {
            flex: 0 0 160px;
            cursor: pointer;
            border-radius: 14px;
            overflow: hidden;
            background: #111;
            transition: 0.25s;
        }
        .memory-card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(229,9,20,0.3);
        }
        .card-img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
        }
        .card-info {
            padding: 0.5rem;
        }
        .card-info h4 {
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .upload-panel {
            background: #0f0f0f;
            margin: 1rem 4%;
            padding: 1.2rem;
            border-radius: 24px;
            display: none;
            border: 1px solid #2a2a2a;
        }
        .drop-zone {
            border: 2px dashed #e50914;
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            background: #1a1a1a;
            margin-bottom: 1rem;
            transition: 0.2s;
        }
        .drop-zone.drag-over {
            background: #2a1515;
            border-color: #ff4444;
        }
        .preview-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin: 1rem 0;
            max-height: 250px;
            overflow-y: auto;
        }
        .preview-item {
            position: relative;
            width: 80px;
        }
        .preview-item img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 12px;
        }
        .preview-item button {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #e50914;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            color: white;
            font-size: 12px;
            cursor: pointer;
        }
        .upload-inputs {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .upload-inputs input {
            flex: 1;
            padding: 10px 15px;
            background: #2a2a2a;
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 0.9rem;
        }
        .upload-btn {
            background: #e50914;
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
        }
        
        .edit-panel {
            background: #0f0f0f;
            margin: 1rem 4%;
            padding: 1.2rem;
            border-radius: 24px;
            display: none;
            border: 1px solid #2a2a2a;
        }
        .edit-item {
            background: #1a1a1a;
            padding: 0.8rem;
            border-radius: 16px;
            margin-bottom: 0.8rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .edit-item img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 10px;
        }
        .edit-item input {
            flex: 2;
            padding: 8px 12px;
            background: #2a2a2a;
            border: none;
            border-radius: 20px;
            color: white;
            min-width: 150px;
        }
        .edit-item button {
            background: #e50914;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            margin: 2px;
        }
        .edit-item button.delete-btn {
            background: #333;
        }
        
        .modal-detail {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1500;
            display: none;
            overflow-y: auto;
        }
        .detail-container {
            max-width: 500px;
            margin: 2rem auto;
            background: #111;
            border-radius: 28px;
            overflow: hidden;
        }
        .detail-media img,
        .detail-media video {
            width: 100%;
            max-height: 55vh;
            object-fit: contain;
            background: #000;
        }
        .detail-info {
            padding: 1.5rem;
        }
        .close-detail {
            float: right;
            font-size: 1.8rem;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 0.8rem;
        }
        
        .bg-music-icon {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1f1f1f;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid #e50914;
            z-index: 1000;
        }
        .loading {
            text-align: center;
            padding: 1.5rem;
            color: #e50914;
        }
        #savedPanel {
            background: #0a0a0a;
            padding: 1rem 4%;
            border-top: 1px solid #2c2c2c;
            display: none;
        }
        #savedListGrid {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding: 0.5rem 0;
        }
        
        @media (max-width: 600px) {
            .memory-card {
                flex: 0 0 140px;
            }
            .edit-item {
                flex-direction: column;
                align-items: stretch;
            }
            .netflix-intro-logo {
                font-size: 5rem;
            }
        }
    </style>
</head>
<body>

<!-- NETFLIX STYLE INTRO - PURE "N" LOGO -->
<div id="introOverlay" class="intro-overlay" style="display: none;">
    <div class="netflix-intro-logo">N</div>
</div>

<!-- LOGIN OVERLAY -->
<div id="loginOverlay" class="login-overlay">
    <div class="login-card">
        <div class="login-logo">N</div>
        <div class="pin-dots" id="pinDots">
            <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
        </div>
        <div class="keypad" id="keypad">
            <button class="key-btn" data-num="1">1</button>
            <button class="key-btn" data-num="2">2</button>
            <button class="key-btn" data-num="3">3</button>
            <button class="key-btn" data-num="4">4</button>
            <button class="key-btn" data-num="5">5</button>
            <button class="key-btn" data-num="6">6</button>
            <button class="key-btn" data-num="7">7</button>
            <button class="key-btn" data-num="8">8</button>
            <button class="key-btn" data-num="9">9</button>
            <button class="key-btn delete-btn" id="deletePin">⌫</button>
            <button class="key-btn" data-num="0">0</button>
            <button class="key-btn" id="clearPin">C</button>
        </div>
        <div id="loginError" class="error-msg"></div>
    </div>
</div>

<!-- MAIN APP -->
<div class="app" id="app">
    <audio id="bgAudio" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>
    <!-- WORKING NETFLIX STYLE SOUND - Using Web Audio API for guaranteed playback -->
    <div style="display:none;" id="soundTrigger"></div>
    <div class="bg-music-icon" id="musicToggleIcon">
        <i class="fas fa-music"></i>
    </div>

    <nav class="navbar">
        <div class="navbar-logo">N</div>
        <div class="nav-icons">
            <i class="fas fa-heart" id="savedNavIcon" title="My List"></i>
            <i class="fas fa-pen" id="editNavIcon" title="Edit"></i>
            <i class="fas fa-upload" id="uploadNavIcon" title="Upload"></i>
        </div>
    </nav>

    <div class="search-filter">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search memories...">
        </div>
    </div>

    <div class="hero">
        <img class="hero-bg" id="heroImg" src="https://picsum.photos/id/104/800/400">
        <div class="hero-content">
            <h1 id="heroTitle">My List</h1>
            <p id="heroDesc">Your private collection</p>
            <button class="hero-btn" id="heroPlayBtn">▶ Watch</button>
        </div>
    </div>

    <div id="loadingIndicator" class="loading" style="display:none;">☁️ Syncing...</div>
    <div id="rowsContainer"></div>

    <div id="savedPanel">
        <h2>⭐ My List</h2>
        <div id="savedListGrid"></div>
    </div>

    <div id="uploadPanel" class="upload-panel">
        <h3>📸 Add New Memory</h3>
        <div class="drop-zone" id="dropZone">
            <i class="fas fa-cloud-upload-alt" style="font-size: 2.5rem; color: #e50914;"></i>
            <p>📱 Click or Drag & Drop photos/videos</p>
            <input type="file" id="fileInput" multiple accept="image/*,video/*" style="display:none">
        </div>
        <div id="previewGrid" class="preview-grid"></div>
        <div class="upload-inputs">
            <input type="text" id="uploadCaption" placeholder="📝 Title / Caption">
            <input type="text" id="uploadDate" placeholder="📅 Date">
        </div>
        <button id="uploadToCloudBtn" class="upload-btn">☁️ Save to Cloud</button>
    </div>

    <div id="editPanel" class="edit-panel">
        <h3>✏️ Edit / Delete Memories</h3>
        <div id="editListContainer"></div>
    </div>

    <div id="detailModal" class="modal-detail">
        <div class="detail-container">
            <button class="close-detail" id="closeDetailBtn">&times;</button>
            <div class="detail-media" id="detailMedia"></div>
            <div class="detail-info">
                <h2 id="detailTitle"></h2>
                <p id="detailDate" style="color:#e50914; margin:8px 0;"></p>
                <p id="detailDesc"></p>
                <button id="saveDetailBtn" style="background:#e50914; border:none; padding:10px 24px; border-radius:30px; margin-top:12px; cursor:pointer;">❤️ Save to My List</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ========== CLOUD SETUP ==========
    const BIN_ID = "69fa15b0aaba88219774a02e";
    const API_KEY = "$2a$10$pP08CJdfkKRhhPHTSZRUJ.OEodgHeAznzbVstoap.5fLfJFQPqLqy";
    const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
    
    let memories = [];
    let savedIds = new Set();
    let currentSearch = "";
    let pendingFiles = [];
    
    // ========== CLOUD FUNCTIONS ==========
    async function loadFromCloud() {
        document.getElementById("loadingIndicator").style.display = "block";
        try {
            const res = await fetch(JSONBIN_URL, { headers: { "X-Master-Key": API_KEY } });
            const data = await res.json();
            document.getElementById("loadingIndicator").style.display = "none";
            return data.record?.memories || [];
        } catch(e) {
            document.getElementById("loadingIndicator").style.display = "none";
            return [];
        }
    }
    
    async function saveToCloud(allMemories) {
        try {
            await fetch(JSONBIN_URL, {
                method: "PUT",
                headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
                body: JSON.stringify({ memories: allMemories })
            });
        } catch(e) { console.error(e); }
    }
    
    function saveLocal() {
        localStorage.setItem(`netflix_memories`, JSON.stringify(memories));
        localStorage.setItem(`netflix_saved`, JSON.stringify([...savedIds]));
    }
    
    function loadLocal() {
        const mem = localStorage.getItem(`netflix_memories`);
        const saved = localStorage.getItem(`netflix_saved`);
        if (mem) memories = JSON.parse(mem);
        if (saved) savedIds = new Set(JSON.parse(saved));
    }
    
    async function syncAll() {
        const cloudMem = await loadFromCloud();
        if (cloudMem.length > 0) memories = cloudMem;
        saveLocal();
        renderRows();
    }
    
    async function addMemoryToCloud(mem) {
        memories.unshift(mem);
        await saveToCloud(memories);
        saveLocal();
        renderRows();
    }
    
    async function updateMemoryInCloud(updatedMem) {
        const index = memories.findIndex(m => m.id === updatedMem.id);
        if (index !== -1) memories[index] = updatedMem;
        await saveToCloud(memories);
        saveLocal();
        renderRows();
    }
    
    async function deleteMemoryFromCloud(memId) {
        memories = memories.filter(m => m.id !== memId);
        savedIds.delete(memId);
        await saveToCloud(memories);
        saveLocal();
        renderRows();
    }
    
    function filterMemories() {
        let filtered = memories.slice();
        if (currentSearch.trim()) {
            const s = currentSearch.toLowerCase();
            filtered = filtered.filter(m => m.title.toLowerCase().includes(s) || (m.description && m.description.toLowerCase().includes(s)));
        }
        return filtered;
    }
    
    function renderRows() {
        const container = document.getElementById("rowsContainer");
        container.innerHTML = "";
        const filtered = filterMemories();
        
        const rowDiv = document.createElement("div"); rowDiv.className = "row";
        rowDiv.innerHTML = `<div class="row-header"><h2>📺 My Memories</h2><span>${filtered.length} items</span></div><div class="horizontal-row" id="mainRow"></div>`;
        container.appendChild(rowDiv);
        const rowContainer = rowDiv.querySelector(".horizontal-row");
        
        if (filtered.length === 0) {
            rowContainer.innerHTML = "<div style='text-align:center; padding:2rem; width:100%; color:#888'>✨ No memories yet. Upload something! ✨</div>";
        } else {
            filtered.forEach(mem => rowContainer.appendChild(createCard(mem)));
        }
        
        updateHeroRandom();
        renderSavedList();
        renderEditList();
    }
    
    function createCard(mem) {
        const div = document.createElement("div"); div.className = "memory-card";
        div.innerHTML = `<img class="card-img" src="${mem.thumbUrl || mem.mediaUrl}"><div class="card-info"><h4>${(mem.title || "Untitled").substring(0,25)}</h4><p>✨ ${mem.date || "No date"}</p></div>`;
        div.onclick = () => openDetail(mem);
        return div;
    }
    
    function openDetail(mem) {
        const modal = document.getElementById("detailModal");
        document.getElementById("detailMedia").innerHTML = mem.type === "video" ? `<video controls autoplay src="${mem.mediaUrl}"></video>` : `<img src="${mem.mediaUrl}">`;
        document.getElementById("detailTitle").innerText = mem.title;
        document.getElementById("detailDate").innerText = mem.date;
        document.getElementById("detailDesc").innerText = mem.description || "💕";
        document.getElementById("saveDetailBtn").onclick = () => { savedIds.add(mem.id); saveLocal(); renderRows(); alert("❤️ Saved to My List!"); };
        modal.style.display = "block";
    }
    
    function renderSavedList() {
        const container = document.getElementById("savedListGrid");
        const saved = memories.filter(m => savedIds.has(m.id));
        container.innerHTML = saved.length ? "" : "<div style='color:#aaa; padding:0.5rem;'>No saved items</div>";
        saved.forEach(mem => {
            const div = document.createElement("div"); div.style.minWidth = "100px"; div.style.cursor = "pointer";
            div.innerHTML = `<img src="${mem.thumbUrl}" style="width:100%; border-radius:12px;"><p style="font-size:11px; margin-top:4px;">${mem.title}</p>`;
            div.onclick = () => openDetail(mem);
            container.appendChild(div);
        });
    }
    
    function renderEditList() {
        const container = document.getElementById("editListContainer");
        container.innerHTML = "";
        if (memories.length === 0) {
            container.innerHTML = "<div style='text-align:center; padding:1rem; color:#888'>No memories to edit</div>";
            return;
        }
        memories.forEach((mem, idx) => {
            const editDiv = document.createElement("div"); editDiv.className = "edit-item";
            editDiv.innerHTML = `
                <img src="${mem.thumbUrl || mem.mediaUrl}">
                <input type="text" id="edit_title_${idx}" value="${escapeHtml(mem.title)}" placeholder="Title">
                <input type="text" id="edit_date_${idx}" value="${escapeHtml(mem.date)}" placeholder="Date">
                <button onclick="saveEdit('${mem.id}', ${idx})">💾 Save</button>
                <button class="delete-btn" onclick="deleteItem('${mem.id}')">🗑️ Delete</button>
            `;
            container.appendChild(editDiv);
        });
    }
    
    window.saveEdit = async (id, idx) => {
        const newTitle = document.getElementById(`edit_title_${idx}`).value;
        const newDate = document.getElementById(`edit_date_${idx}`).value;
        const mem = memories.find(m => m.id === id);
        if (mem) {
            mem.title = newTitle;
            mem.date = newDate;
            await updateMemoryInCloud(mem);
        }
    };
    
    window.deleteItem = async (id) => {
        if(confirm("Delete forever?")) {
            await deleteMemoryFromCloud(id);
        }
    };
    
    function escapeHtml(str) { return str?.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}) || ""; }
    
    function updateHeroRandom() {
        const all = filterMemories();
        if(all.length) {
            const f = all[Math.floor(Math.random()*all.length)];
            document.getElementById("heroImg").src = f.thumbUrl;
            document.getElementById("heroTitle").innerText = f.title;
            document.getElementById("heroDesc").innerText = f.description || "Your memory 💕";
            document.getElementById("heroPlayBtn").onclick = () => openDetail(f);
        }
    }
    
    // ========== UPLOAD HANDLING ==========
    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const previewGrid = document.getElementById("previewGrid");
    
    function handleFiles(files) {
        for(let file of files) {
            if(file.type.startsWith("image/") || file.type.startsWith("video/")) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    pendingFiles.push({
                        dataURL: e.target.result,
                        type: file.type.startsWith("image/") ? "photo" : "video"
                    });
                    renderPreview();
                };
                reader.readAsDataURL(file);
            } else { alert("Only photos/videos allowed!"); }
        }
    }
    
    function renderPreview() {
        previewGrid.innerHTML = "";
        pendingFiles.forEach((item, idx) => {
            const div = document.createElement("div"); div.className = "preview-item";
            div.innerHTML = `<img src="${item.dataURL}"><button onclick="removeFile(${idx})">✕</button>`;
            previewGrid.appendChild(div);
        });
    }
    
    window.removeFile = (idx) => { pendingFiles.splice(idx,1); renderPreview(); };
    
    dropZone.onclick = () => fileInput.click();
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add("drag-over"); };
    dropZone.ondragleave = () => dropZone.classList.remove("drag-over");
    dropZone.ondrop = (e) => {
        e.preventDefault();
        dropZone.classList.remove("drag-over");
        handleFiles(e.dataTransfer.files);
    };
    fileInput.onchange = (e) => handleFiles(e.target.files);
    
    document.getElementById("uploadToCloudBtn").onclick = async () => {
        if(pendingFiles.length === 0) return alert("Select photos/videos first!");
        const caption = document.getElementById("uploadCaption").value;
        const date = document.getElementById("uploadDate").value || new Date().toLocaleDateString();
        
        for(let item of pendingFiles) {
            const newMem = {
                id: Date.now() + "-" + Math.random(),
                title: caption.trim() || "New Memory 💕",
                description: "Added with love",
                date: date,
                type: item.type,
                mediaUrl: item.dataURL,
                thumbUrl: item.dataURL
            };
            await addMemoryToCloud(newMem);
        }
        pendingFiles = [];
        renderPreview();
        document.getElementById("uploadCaption").value = "";
        document.getElementById("uploadDate").value = "";
        alert("✨ Uploaded successfully! ✨");
        document.getElementById("uploadPanel").style.display = "none";
    };
    
    // ========== NETFLIX STYLE INTRO WITH GUARANTEED SOUND ==========
    let enteredPin = "";
    const CORRECT_PIN = "1127";
    
    function updatePinDots() {
        document.querySelectorAll(".pin-dot").forEach((dot, i) => {
            if(i < enteredPin.length) dot.classList.add("filled");
            else dot.classList.remove("filled");
        });
    }
    
    // Function to play Netflix-style sound using Web Audio API (guaranteed to work)
    function playNetflixSound() {
        try {
            // Create audio context (works on all modern browsers)
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            // Create oscillator for dramatic sound
            const now = audioContext.currentTime;
            const gainNode = audioContext.createGain();
            gainNode.connect(audioContext.destination);
            
            // First low boom
            const osc1 = audioContext.createOscillator();
            osc1.type = 'sine';
            osc1.frequency.value = 80;
            osc1.connect(gainNode);
            osc1.start(now);
            osc1.stop(now + 0.6);
            
            // Second higher impact
            const osc2 = audioContext.createOscillator();
            osc2.type = 'sine';
            osc2.frequency.value = 160;
            osc2.connect(gainNode);
            osc2.start(now + 0.05);
            osc2.stop(now + 0.55);
            
            // Volume envelope
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
            
            // Resume audio context (required after user interaction)
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        } catch(e) {
            console.log("Web Audio not supported, playing fallback");
            // Fallback: create a simple beep
            const audio = new Audio();
            audio.src = "data:audio/wav;base64,U3RlYWx0aCBhdWRpbyBkYXRh";
            audio.play().catch(console.log);
        }
    }
    
    function playIntroAndLoadApp() {
        const introOverlay = document.getElementById("introOverlay");
        
        introOverlay.style.display = "flex";
        
        // Play the Netflix-style dramatic sound
        playNetflixSound();
        
        setTimeout(() => {
            introOverlay.style.opacity = "0";
            setTimeout(() => {
                introOverlay.style.display = "none";
                document.getElementById("loginOverlay").style.display = "none";
                document.getElementById("app").style.display = "block";
                loadLocal();
                syncAll();
            }, 800);
        }, 1600);
    }
    
    async function checkLogin() {
        if(enteredPin === CORRECT_PIN) {
            document.getElementById("loginOverlay").style.opacity = "0";
            playIntroAndLoadApp();
        } else if(enteredPin.length === 4) {
            document.getElementById("loginError").innerHTML = "❌ Wrong PIN! (1127)";
            enteredPin = "";
            updatePinDots();
            setTimeout(() => document.getElementById("loginError").innerHTML = "", 1500);
        }
    }
    
    function addDigit(d) { if(enteredPin.length < 4) { enteredPin += d; updatePinDots(); if(enteredPin.length === 4) checkLogin(); } }
    
    document.querySelectorAll(".key-btn[data-num]").forEach(btn => btn.onclick = () => addDigit(btn.getAttribute("data-num")));
    document.getElementById("deletePin").onclick = () => { if(enteredPin.length > 0) { enteredPin = enteredPin.slice(0,-1); updatePinDots(); } };
    document.getElementById("clearPin").onclick = () => { enteredPin = ""; updatePinDots(); document.getElementById("loginError").innerHTML = ""; };
    
    // ========== EVENT LISTENERS ==========
    document.getElementById("searchInput").oninput = (e) => { currentSearch = e.target.value; renderRows(); };
    document.getElementById("closeDetailBtn").onclick = () => document.getElementById("detailModal").style.display = "none";
    document.getElementById("savedNavIcon").onclick = () => { const p = document.getElementById("savedPanel"); p.style.display = p.style.display === "none" ? "block" : "none"; renderSavedList(); };
    document.getElementById("uploadNavIcon").onclick = () => { 
        document.getElementById("uploadPanel").style.display = "block";
        document.getElementById("editPanel").style.display = "none";
    };
    document.getElementById("editNavIcon").onclick = () => {
        document.getElementById("editPanel").style.display = "block";
        document.getElementById("uploadPanel").style.display = "none";
        renderEditList();
    };
    
    let musicOn = false, audio = document.getElementById("bgAudio");
    document.getElementById("musicToggleIcon").onclick = () => {
        if(musicOn) { audio.pause(); musicOn=false; }
        else { audio.play().catch(e=>{}); musicOn=true; }
    };
    
    window.onclick = (e) => { if(e.target === document.getElementById("detailModal")) document.getElementById("detailModal").style.display = "none"; };
</script>
</body>
